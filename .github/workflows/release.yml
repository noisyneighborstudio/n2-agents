name: Build and publish updates

# Publishes only the commit a successful CI run verified. "Verify slices" runs
# scripts/verify.sh and the fleet suites on every push; running them again here
# made each release take an extra 45 minutes to prove the same commit.
on:
  workflow_run:
    workflows: [Verify slices]
    types: [completed]
    branches: [main, stable]

permissions:
  contents: write

concurrency:
  group: sparkle-publication
  cancel-in-progress: false

jobs:
  publish:
    # Every CI job (verify and fleet) passed, on a push, for this exact commit.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    # Liquid Glass (NSGlassEffectView) needs the macOS 26 SDK.
    runs-on: macos-26
    env:
      # A workflow_run event's GITHUB_REF is always the default branch. The
      # channel and semantic-release's branch come from the run that passed.
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          # semantic-release and publish-appcast.sh authenticate explicitly; a
          # persisted github.token header would override the updates-repo token.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          # The lockfile is written by npm 11 (Node 24); an older npm's `npm ci`
          # resolves it differently and rejects it as out of sync.
          node-version: 24
      - name: Select isolated channel
        run: |
          set -euo pipefail
          case "$HEAD_BRANCH" in
            main) channel=continuous ;;
            stable) channel=stable ;;
            *) exit 64 ;;
          esac
          echo "N2_CHANNEL=$channel" >> "$GITHUB_ENV"
      - name: Import Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::secret for $name is not set"; exit 1; }
          done
          cert="$RUNNER_TEMP/developer-id.p12"; keychain="$RUNNER_TEMP/n2agents.keychain-db"
          umask 077; printf '%s' "$CERTIFICATE" | base64 -D > "$cert"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Uploads archives + appcasts to N2_UPDATES_REPO (updates.env). The
          # secret is only needed when that is another repo. Not GH_TOKEN:
          # semantic-release would prefer it over GITHUB_TOKEN for this repo.
          N2_UPDATES_TOKEN: ${{ secrets.N2_UPDATES_TOKEN || github.token }}
          # Monotonic across both channels. Resets if this file is renamed.
          N2_BUILD_NUMBER: ${{ github.run_number }}
          N2_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_KEY_ISSUER: ${{ secrets.NOTARY_KEY_ISSUER }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          for name in N2_SIGN_IDENTITY SPARKLE_PRIVATE_KEY; do
            [ -n "${!name}" ] || { echo "::error::secret for $name is not set"; exit 1; }
          done
          npm ci --no-audit --no-fund
          # GITHUB_* cannot be set through GITHUB_ENV; pass the branch directly.
          GITHUB_REF="refs/heads/$HEAD_BRANCH" npx semantic-release
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8"
          security delete-keychain "$RUNNER_TEMP/n2agents.keychain-db" 2>/dev/null || true
