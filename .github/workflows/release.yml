name: Build and publish updates

on:
  push:
    branches: [main, release]

permissions:
  contents: write

concurrency:
  group: sparkle-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select isolated channel
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main) channel=continuous ;;
            refs/heads/release) channel=stable ;;
            *) exit 64 ;;
          esac
          echo "CLAUDES_CHANNEL=$channel" >> "$GITHUB_ENV"
      - name: Import Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE"; test -n "$CERTIFICATE_PASSWORD"; test -n "$KEYCHAIN_PASSWORD"
          cert="$RUNNER_TEMP/developer-id.p12"; keychain="$RUNNER_TEMP/claudes.keychain-db"
          umask 077; printf '%s' "$CERTIFICATE" | base64 -D > "$cert"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          N2_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          N2_SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_KEY_ISSUER: ${{ secrets.NOTARY_KEY_ISSUER }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "$N2_SIGN_IDENTITY"; test -n "$N2_SPARKLE_PUBLIC_KEY"; test -n "$SPARKLE_PRIVATE_KEY"
          npm install --no-audit --no-fund
          npx semantic-release
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle-private-key"
          security delete-keychain "$RUNNER_TEMP/claudes.keychain-db" 2>/dev/null || true
