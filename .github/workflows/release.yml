name: Build and publish updates

on:
  push:
    branches: [main, stable]

permissions:
  contents: write

concurrency:
  group: sparkle-publication
  cancel-in-progress: false

jobs:
  publish:
    # Liquid Glass (NSGlassEffectView) needs the macOS 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Select isolated channel
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main) channel=continuous ;;
            refs/heads/stable) channel=stable ;;
            *) exit 64 ;;
          esac
          echo "N2_CHANNEL=$channel" >> "$GITHUB_ENV"
      - name: Test
        run: ./scripts/test.sh
      - name: Import Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::secret for $name is not set"; exit 1; }
          done
          cert="$RUNNER_TEMP/developer-id.p12"; keychain="$RUNNER_TEMP/n2agents.keychain-db"
          umask 077; printf '%s' "$CERTIFICATE" | base64 -D > "$cert"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Monotonic across both channels. Resets if this file is renamed.
          N2_BUILD_NUMBER: ${{ github.run_number }}
          N2_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_KEY_ISSUER: ${{ secrets.NOTARY_KEY_ISSUER }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          for name in N2_SIGN_IDENTITY SPARKLE_PRIVATE_KEY; do
            [ -n "${!name}" ] || { echo "::error::secret for $name is not set"; exit 1; }
          done
          npm ci --no-audit --no-fund
          npx semantic-release
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8"
          security delete-keychain "$RUNNER_TEMP/n2agents.keychain-db" 2>/dev/null || true
