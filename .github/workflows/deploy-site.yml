name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

# A later merge should win, but never mid-upload.
concurrency:
  group: deploy-site
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: site

jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # Runs on pull requests too, where no secret is available, so a broken
      # Worker is caught before it can be merged rather than after.
      - name: Build
        run: npx wrangler deploy --dry-run --outdir /tmp/site-build

      - name: Check credentials
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings > Secrets and variables > Actions. The token needs Account / Workers Scripts: Edit."
            exit 1
          fi

      # Code only. `wrangler deploy` also re-syncs triggers, which needs
      # Zone / Workers Routes on the token and failed the first merge after
      # the code had already gone live. The custom domain is attached and
      # rarely changes, so CI leaves triggers alone. After editing `routes`
      # in wrangler.jsonc, apply them once by hand: npx wrangler triggers deploy
      - name: Deploy
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
        run: |
          set -euo pipefail
          npx wrangler versions upload --message "${GITHUB_SHA::7}"
          id=$(jq -r 'select(.type == "version-upload") | .version_id' "$WRANGLER_OUTPUT_FILE_PATH")
          [ -n "$id" ] || { echo "::error::wrangler reported no version id"; exit 1; }
          npx wrangler versions deploy "$id@100" --yes --message "${GITHUB_SHA::7}"

      # Deploying without checking is how a broken page sits there for a week.
      - name: Verify the live site
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          base=https://agents.noisyneighbor.studio

          for path in / /og.png; do
            for attempt in 1 2 3 4 5; do
              read -r code type < <(curl -fsS --max-time 20 -o /tmp/body \
                -w '%{http_code} %{content_type}\n' "$base$path" || echo "000 none")
              [ "$code" = "200" ] && break
              echo "$path -> $code, retrying ($attempt)"
              sleep 6
            done
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
            echo "$path -> $code $type"
          done

          # The unfurl card is generated, so a 200 is not enough: an empty or
          # non-PNG body would still unfurl as a broken image everywhere.
          file /tmp/body | grep -q 'PNG image data, 1200 x 630' \
            || { echo "::error::/og.png is not a 1200x630 PNG"; exit 1; }
          echo "og.png verified"
